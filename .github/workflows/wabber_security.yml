name: Wabber Security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REPORTS_DIR: .reports
  API_URL: ${{ secrets.WABBER_SECURITY_API_URL }}
  API_TOKEN: ${{ secrets.WABBER_SECURITY_TOKEN }}
  REPO_URL: ${{ github.event.repository.html_url }}

jobs:
  security-scan:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create reports directory
        run: mkdir -p ${{ env.REPORTS_DIR }}

      # ── Vulnerability Scans ──────────────────────────────────
      - name: Composer audit
        run: |
          if [ -f composer.lock ]; then
            composer audit --format=json > ${{ env.REPORTS_DIR }}/composer_audit_latest.json 2>/dev/null || true
          fi

      - name: NPM audit
        run: |
          if [ -f package-lock.json ]; then
            npm audit --json > ${{ env.REPORTS_DIR }}/npm_audit_latest.json 2>/dev/null || true
          fi

      - name: Yarn audit
        run: |
          if [ -f yarn.lock ]; then
            yarn audit --json > ${{ env.REPORTS_DIR }}/yarn_audit_latest.json 2>/dev/null || true
          fi

      - name: Pip audit
        run: |
          if [ -f requirements.txt ] || [ -f Pipfile.lock ] || [ -f poetry.lock ]; then
            pip install pip-audit 2>/dev/null || true
            pip-audit --format=json > ${{ env.REPORTS_DIR }}/pip_audit_latest.json 2>/dev/null || true
          fi

      # ── License Compliance ───────────────────────────────────
      - name: Composer licenses
        run: |
          if [ -f composer.lock ]; then
            composer licenses --format=json > ${{ env.REPORTS_DIR }}/composer_licenses_latest.json 2>/dev/null || true
          fi

      - name: NPM licenses
        run: |
          if [ -f package-lock.json ] || [ -f yarn.lock ]; then
            npx --yes license-checker --json > ${{ env.REPORTS_DIR }}/npm_licenses_latest.json 2>/dev/null || true
          fi

      # ── Secret Scan ──────────────────────────────────────────
      - name: Gitleaks
        run: |
          if command -v gitleaks >/dev/null 2>&1; then
            gitleaks detect --source . --report-format json --report-path ${{ env.REPORTS_DIR }}/secret_scan_latest.json --no-banner --exit-code 0 2>/dev/null
            if [ ! -s ${{ env.REPORTS_DIR }}/secret_scan_latest.json ]; then
              echo "[]" > ${{ env.REPORTS_DIR }}/secret_scan_latest.json
            fi
          fi

      # ── Push Reports ─────────────────────────────────────────
      - name: Push reports to IMS
        run: |
          ERRORS=0
          for file in ${{ env.REPORTS_DIR }}/*_latest.json; do
            [ -f "$file" ] || continue
            type=$(basename "$file" _latest.json)
            echo "Pushing $type..."
            RESPONSE=$(jq -n --arg type "$type" \
              --arg scanned "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg repo "${{ env.REPO_URL }}" \
              --slurpfile payload "$file" \
              '{report_type: $type, scanned_at: $scanned, repo_url: $repo, payload: $payload[0]}' \
              | curl -s -w "\n%{http_code}" -X POST "${{ env.API_URL }}" \
                  -H "Authorization: Bearer ${{ env.API_TOKEN }}" \
                  -H "Content-Type: application/json" \
                  -d @-)
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            echo "$BODY"
            if [ "$HTTP_CODE" -ge 400 ]; then
              echo "::error::Push $type failed (HTTP $HTTP_CODE)"
              ERRORS=$((ERRORS + 1))
            fi
          done
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::$ERRORS report(s) failed to push"
            exit 1
          fi

      # ── PR Quality Gate ──────────────────────────────────────
      - name: Quality gate (PR only)
        if: github.event_name == 'pull_request'
        run: |
          CRITICAL=0
          HIGH=0
          for file in ${{ env.REPORTS_DIR }}/*_latest.json; do
            [ -f "$file" ] || continue
            type=$(basename "$file" _latest.json)
            case "$type" in
              composer_audit)
                CRITICAL=$((CRITICAL + $(jq '[.advisories[][]? | select(.severity == "critical")] | length' "$file" 2>/dev/null || echo 0)))
                HIGH=$((HIGH + $(jq '[.advisories[][]? | select(.severity == "high")] | length' "$file" 2>/dev/null || echo 0)))
                ;;
              npm_audit)
                CRITICAL=$((CRITICAL + $(jq '[.vulnerabilities[]? | select(.severity == "critical")] | length' "$file" 2>/dev/null || echo 0)))
                HIGH=$((HIGH + $(jq '[.vulnerabilities[]? | select(.severity == "high")] | length' "$file" 2>/dev/null || echo 0)))
                ;;
              secret_scan)
                HIGH=$((HIGH + $(jq 'length' "$file" 2>/dev/null || echo 0)))
                ;;
            esac
          done
          echo "Critical: $CRITICAL, High: $HIGH"
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "::error::Quality gate failed: $CRITICAL critical, $HIGH high findings"
            exit 1
          fi
  sonarqube:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Sonar properties
        id: check-sonar
        run: |
          if [ -f "sonar-project.properties" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set short SHA
        if: steps.check-sonar.outputs.exists == 'true'
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: SonarQube scan
        if: steps.check-sonar.outputs.exists == 'true'
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectVersion=prod-${{ env.SHORT_SHA }}